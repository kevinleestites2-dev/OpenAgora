name: OpenAgora — Simulate Engine

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run one cycle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POLYMARKET_API_KEY: ${{ secrets.POLYMARKET_API_KEY }}
          POLYMARKET_API_SECRET: ${{ secrets.POLYMARKET_API_SECRET }}
          POLYMARKET_API_PASSPHRASE: ${{ secrets.POLYMARKET_API_PASSPHRASE }}
          POLYMARKET_WALLET: ${{ secrets.POLYMARKET_WALLET }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          MIN_CONFIDENCE: ${{ secrets.MIN_CONFIDENCE }}
          SIMULATE_MODE: ${{ secrets.SIMULATE_MODE }}
          CYCLE_INTERVAL: "0"
        run: python core/agora_engine.py --mode simulate --once
